{{- if and .Values.mcp.enabled (not (include "material-flow-control.agentsColocated" .)) }}
{{- include "material-flow-control.require" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "material-flow-control.mcpFullname" . }}
  labels:
    {{- include "material-flow-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  annotations:
    # agents.colocate cutover (ADR 0012): ArgoCD prunes this Deployment only after <release>-agents serves.
    # On the un-flip (rollback) wave -1 recreates it and waits Healthy before the wave-0 Services switch
    # back, so the rollback has no 503 window. Deployment-object annotations: syncing them rolls no pod.
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: PruneLast=true
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "material-flow-control.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "material-flow-control.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "material-flow-control.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "material-flow-control.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          # Endpoint-removal drain (capacity step 3 follow-up): Kong routes to pod IPs and drops a terminating
          # pod only on its next config sync, seconds later, while cmd/mcp closes its listener at SIGTERM and an
          # idle process exits at once; without this delay Kong keeps sending to a vanished pod IP (a 502 or a
          # connect timeout through Kong on every roll). The kubelet-native sleep needs no shell (distroless).
          # terminationGracePeriodSeconds must stay above this sleep + the 10 s HTTP drain.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - name: http
              containerPort: {{ include "material-flow-control.port" .Values.mcp.addr }}
              protocol: TCP
          # Env contract = exactly what cmd/mcp reads (render_test.sh diffs it). Read-only (ADR 0007, ruling
          # P4-R17): no Kafka, no subsystem URL, no outbox; the api ConfigMap is NOT mounted as env, only its
          # flow-layout.yaml key as a file, so no api variable leaks in.
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.addr | quote }}
            - name: MFC_LAYOUT_FILE
              value: {{ .Values.config.layoutFile | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SERVICE_VERSION
              value: {{ include "material-flow-control.serviceVersion" . | quote }}
            # ruling P4-R18: deployment.environment.name (read by the telemetry adapter).
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: OTEL_SERVICE_NAME
              value: "material-flow-control-mcp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ ternary .Values.otel.endpoint "" .Values.otel.enabled | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "material-flow-control.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "material-flow-control.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
          volumeMounts:
            - name: layout
              mountPath: {{ dir .Values.config.layoutFile }}
              readOnly: true
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      volumes:
        - name: layout
          configMap:
            name: {{ include "material-flow-control.fullname" . }}
            items:
              - key: flow-layout.yaml
                path: {{ base .Values.config.layoutFile }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
