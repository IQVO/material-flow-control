{{- include "material-flow-control.require" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "material-flow-control.fullname" . }}
  labels:
    {{- include "material-flow-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate # never two dispatchers or consumer sets, not even during a rollout (D19)
  selector:
    matchLabels:
      {{- include "material-flow-control.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "material-flow-control.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "material-flow-control.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "material-flow-control.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "material-flow-control.fullname" . }}
          # Env contract = exactly what cmd/api reads (render_test.sh diffs it): every non-secret variable from the
          # ConfigMap, the two database URLs from the Secret. No equipment link: this context calls only the subsystems.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "material-flow-control.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "material-flow-control.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
          volumeMounts:
            - name: layout
              mountPath: {{ dir .Values.config.layoutFile }}
              readOnly: true
          # The boot runs the migrations and dials Kafka before it listens: up to 60 s of startup budget.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: layout
          configMap:
            name: {{ include "material-flow-control.fullname" . }}
            items:
              - key: flow-layout.yaml
                path: {{ base .Values.config.layoutFile }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
