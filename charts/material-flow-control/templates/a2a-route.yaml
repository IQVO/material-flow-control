{{- if and .Values.gatewayApi.enabled .Values.a2a.enabled .Values.a2a.route.enabled -}}
{{- /*
A2A exposure through the gateway (fleet decision: gateway config lives in the
application charts, not in the infrastructure repo).

Host contract: /api/a2a/<context> -> Service <context>-a2a:8093, prefix
rewritten to / (so the Agent Card stays reachable under the same prefix at
/api/a2a/<context>/.well-known/agent-card.json and JSON-RPC at the prefix
itself; /healthz deliberately stays off the host -- it is a Kubernetes probe
concern, not a public endpoint). No auth anywhere on the route (fleet-wide
revert 2026-09-11): access control is the in-cluster boundary.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "material-flow-control.a2aFullname" . }}
  labels:
    {{- include "material-flow-control.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
  {{- with include "material-flow-control.kongPluginNames" . }}
  annotations:
    konghq.com/plugins: {{ . | quote }}
  {{- end }}
spec:
  # carry (Task 23 review): a2a.route.parentRefs (warehouse-infra's _platform.yaml), else gatewayApi.parentRefs.
  parentRefs:
    {{- include "material-flow-control.parentRefs" (.Values.a2a.route.parentRefs | default .Values.gatewayApi.parentRefs) | trim | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.a2a.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "material-flow-control.a2aFullname" . }}
          port: {{ include "material-flow-control.port" .Values.a2a.addr }}
{{- end }}
