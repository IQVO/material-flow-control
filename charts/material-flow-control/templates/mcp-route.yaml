{{- if and .Values.gatewayApi.enabled .Values.mcp.enabled .Values.mcp.route.enabled -}}
{{- /*
MCP exposure through the gateway (fleet decision: gateway config lives in the
application charts, not in the infrastructure repo).

Host contract: /api/mcp/<context> -> Service <context>-mcp:8090, prefix
rewritten to /mcp (the SDK's canonical endpoint on cmd/mcp; /healthz
deliberately stays off the host -- it is a Kubernetes probe concern, not a
public endpoint). No auth anywhere on the route (fleet-wide revert
2026-09-11): access control is the in-cluster boundary.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "material-flow-control.mcpFullname" . }}
  labels:
    {{- include "material-flow-control.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  {{- with include "material-flow-control.kongPluginNames" . }}
  annotations:
    konghq.com/plugins: {{ . | quote }}
  {{- end }}
spec:
  # carry (Task 23 review): mcp.route.parentRefs (warehouse-infra's _platform.yaml), else gatewayApi.parentRefs.
  parentRefs:
    {{- include "material-flow-control.parentRefs" (.Values.mcp.route.parentRefs | default .Values.gatewayApi.parentRefs) | trim | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.mcp.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - name: {{ include "material-flow-control.mcpFullname" . }}
          port: {{ include "material-flow-control.port" .Values.mcp.addr }}
{{- end }}
