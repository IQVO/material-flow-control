{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "material-flow-control.mcpFullname" . }}
  labels:
    {{- include "material-flow-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  ports:
    - port: {{ include "material-flow-control.port" .Values.mcp.addr }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "material-flow-control.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
{{- end }}
